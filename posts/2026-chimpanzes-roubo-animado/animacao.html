<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Capa animada (1080x1440, 3:4). Gere o vídeo com:
     node scripts/render-video.js posts/2026-chimpanzes-roubo-animado/animacao.html posts/2026-chimpanzes-roubo-animado/chimpanzes-animado.mp4 9 -->
<style>
  @font-face { font-family: 'Playfair'; font-weight: 300 900;
               src: url(../../assets/fonts/Playfair2-latin.woff2) format('woff2'); }
  :root { --cream: #F4EEE2; --yellow: #F2C94C; --muted: #A9BFB3; --ease: cubic-bezier(.2, .8, .2, 1); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1440px; overflow: hidden; background: #0D261B; font-family: 'Inter', sans-serif; }
  .stage { position: relative; width: 1080px; height: 1440px; overflow: hidden; }

  /* Foto: zoom lento para fora + leve deslize */
  .bg { position: absolute; inset: 0; background: url(fundo.png) center / cover;
        transform-origin: 62% 45%; animation: kenburns 9s cubic-bezier(.25, .1, .25, 1) both; }
  @keyframes kenburns { from { transform: scale(1.14) translateY(-14px); } to { transform: scale(1); } }
  /* Escurece um pouco no início para o texto "nascer" do escuro */
  .shade { position: absolute; inset: 0; background: #0D261B; animation: fade-out 1.2s ease both; }
  @keyframes fade-out { from { opacity: .55; } to { opacity: 0; } }

  /* Crédito da foto fica fixo (fora do zoom) para estar sempre legível */
  .credit { position: absolute; top: 40px; right: 44px; padding: 9px 16px; border-radius: 22px;
            background: rgba(10, 25, 18, .55); color: #fff; font-size: 22px; font-weight: 500; }
  .text { position: absolute; left: 90px; right: 90px; top: 0; }

  .label { position: absolute; top: 682px; display: flex; align-items: center; gap: 18px;
           color: var(--yellow); font-weight: 800; font-size: 27px; letter-spacing: .145em; }
  .label i { display: block; width: 42px; height: 4px; background: var(--yellow); border-radius: 2px;
             transform-origin: left; animation: grow .6s var(--ease) .25s both; }
  .label span { display: block; animation: slide-in .7s var(--ease) .45s both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }

  h1 { position: absolute; top: 728px; font-family: 'Playfair', serif; font-weight: 900; font-variation-settings: 'opsz' 1200;
       font-size: 125px; line-height: 125px; letter-spacing: -.035em; color: var(--cream); margin-left: -4px; }
  h1 .line { display: block; overflow: hidden; padding-bottom: 14px; margin-bottom: -14px; }
  h1 .w { display: inline-block; animation: rise .9s var(--ease) both; }
  @keyframes rise { from { transform: translateY(105%); } to { transform: none; } }
  h1 .hl { color: var(--yellow); position: relative; }
  h1 .hl .pop { display: inline-block; animation: pop .7s var(--ease) 2.05s both; }
  @keyframes pop { 0% { transform: none; } 45% { transform: scale(1.05) translateY(-4px); } 100% { transform: none; } }
  h1 .hl::after { content: ''; position: absolute; left: 4px; right: 4px; bottom: 6px; height: 7px;
                  background: var(--yellow); border-radius: 4px; transform-origin: left;
                  animation: grow .55s var(--ease) 2.1s both; }

  .sub { position: absolute; top: 1128px; font-size: 38px; line-height: 54px; color: var(--cream); }
  .sub span { display: block; animation: fade-up .8s var(--ease) both; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

  .foot { position: absolute; top: 1346px; left: 0; right: 0; display: flex; justify-content: space-between;
          font-size: 28px; animation: fade-up .8s var(--ease) 3.6s both; }
  .foot .date { color: var(--muted); }
  .foot .swipe { color: var(--yellow); font-weight: 700; }
  .foot .swipe b { display: inline-block; font-weight: 400; animation: nudge 1.2s ease-in-out 4.2s 4; }
  @keyframes nudge { 0%, 100% { transform: none; } 50% { transform: translateX(12px); } }
</style>
</head>
<body>
<div class="stage">
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="credit">Foto: Satya Deep / Unsplash (ilustrativa)</div>
  <div class="text">
    <div class="label"><i></i><span>COMPORTAMENTO ANIMAL</span></div>
    <h1>
      <span class="line"><span class="w" style="animation-delay:.8s">Chimpanzés</span></span>
      <span class="line"><span class="w" style="animation-delay:1.1s">roubam</span>
        <span class="w hl" style="animation-delay:1.25s"><span class="pop">menos</span></span>
        <span class="w" style="animation-delay:1.4s">dos</span></span>
      <span class="line"><span class="w" style="animation-delay:1.6s">amigos</span></span>
    </h1>
    <div class="sub">
      <span style="animation-delay:2.6s">Um experimento com pedaços de abacaxi mostra</span>
      <span style="animation-delay:2.8s">que a amizade freia o roubo — e muda a reação</span>
      <span style="animation-delay:3.0s">de quem rouba e de quem é roubado.</span>
    </div>
    <div class="foot"><span class="date">Estudo publicado em set/2026</span><span class="swipe">Arraste <b>→</b></span></div>
  </div>
</div>
</body>
</html>
